# ──────────────────────────────
#  Session & Startup
# ──────────────────────────────
# 设置默认会话从当前目录启动（此行为需由外部调用保证）
# 推荐：通过 shell 别名启动 tmux，例如：
#   alias tmux='tmux new-session -c "$PWD"'
new-session -c "#{session_path}"


# ──────────────────────────────
#  Key: Prefix
# ──────────────────────────────
unbind C-b
set -g prefix `
bind ` send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display "✅ Config reloaded!"


# ──────────────────────────────
#  Indexing & Behavior
# ──────────────────────────────
# 1-based indexing
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1

# 自动重编号窗口
set -g renumber-windows on

# 自动重命名窗口（根据运行命令）
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'


# ──────────────────────────────
#  Pane Navigation & Split
# ──────────────────────────────
# 使用 h/j/k/l 切换窗格
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 使用 Alt+hjkl 快速切换（无需 prefix）
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# 分割窗格并继承当前工作目录 ✅
bind '"' split-pane -v -c "#{pane_current_path}"  # 垂直分割
bind % split-pane -h -c "#{pane_current_path}"    # 水平分割


# ──────────────────────────────
#  Copy Mode (vi-style)
# ──────────────────────────────
setw -g mode-keys vi

# 进入复制模式
bind -n M-v copy-mode

# 在 copy-mode 中：
# - v 开始选择
# - y 复制并退出
# - Y 复制到行尾
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-end-of-line
bind -T copy-mode-vi '<' send-keys -X start-of-line
bind -T copy-mode-vi '>' send-keys -X end-of-line


# ──────────────────────────────
#  Options
# ──────────────────────────────
# 启用鼠标（选择窗格、滚动、调整大小）
set -g mouse on

# 正确的颜色支持
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'  # 启用 truecolor

# 增大历史缓冲区
set -g history-limit 50000

# Ctrl-Space 切换布局
bind -n C-Space next-layout


# ──────────────────────────────
#  Status Bar: Catppuccin (精简版)
# ──────────────────────────────
# 使用 mocha 风味（深色）
set -g @catppuccin_flavor "mocha"
# 窗口状态样式：圆角
set -g @catppuccin_window_status_style "rounded"

set -g status-right-length 100
set -g status-left-length 50

# 清空左侧状态栏
set -g status-left ""

# 只保留：应用图标 + 会话 + 运行时间 + 时间
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# ──────────────────────────────
#  Load Plugins (手动路径)
# ──────────────────────────────
# 加载 Catppuccin 主题（不使用 TPM）
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
